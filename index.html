<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gapfill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <div class="content">
      <h1>How much time do you have?</h1>
      <p class="subhead">We'll find the best use for your time.</p>

      <div class="stepper-wrap">
        <div class="stepper">
          <button id="decrease" aria-label="Decrease minutes">&minus;</button>
          <div class="stepper-value">
            <div class="num" id="minutes-display">45</div>
            <div class="label">minutes free</div>
          </div>
          <button id="increase" aria-label="Increase minutes">+</button>
        </div>
      </div>

      <a href="classes.html" class="btn-primary">Import my schedule</a>
      <p class="helper-text">Connects your classes and homework</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
