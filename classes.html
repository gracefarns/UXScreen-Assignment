<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gapfill – Your classes today</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="topbar">
      <a href="index.html" class="back-link">&#8249; Home</a>
    </div>
    <div class="content">
      <h1>Your classes today</h1>
      <p class="subhead" id="current-time">It's 9:52 am</p>

      <div class="class-group">
        <div class="class-row done">
          <div class="check">&#10003;</div>
          <div style="flex:1"><p class="class-name">Econ 110</p></div>
          <span class="class-time">9:00 am</span>
        </div>
        <div class="class-row next">
          <div class="dot next"></div>
          <div style="flex:1">
            <p class="class-name">Chem 105</p>
            <p class="next-label">Next</p>
          </div>
          <span class="class-time">11:00 am</span>
        </div>
        <div class="class-row">
          <div class="dot upcoming"></div>
          <div style="flex:1"><p class="class-name">Stat 121</p></div>
          <span class="class-time">2:00 pm</span>
        </div>
      </div>

      <p class="section-label">Your to-dos</p>
      <div class="todo-card">
        <p>Chem 105 lab report</p>
        <span>Due Fri</span>
      </div>

      <div class="spacer"></div>
      <a href="plan.html" class="btn-primary">Build my plan</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
