<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gapfill – Your plan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="topbar">
      <a href="index.html" class="back-link">&#8249; Home</a>
    </div>
    <div class="content">
      <h1 id="minutes-headline">45 minutes free</h1>
      <p class="subhead">Until Chem 105</p>

      <div class="task-group">
        <div class="task-row">
          <button class="task-circle" data-minutes="15" aria-label="Mark complete"></button>
          <div class="task-name">Review Econ 110 reading</div>
          <span class="task-time">15 min</span>
        </div>
        <div class="task-row">
          <button class="task-circle" data-minutes="20" aria-label="Mark complete"></button>
          <div class="task-name">Outline Chem lab report</div>
          <span class="task-time">20 min</span>
        </div>
        <div class="task-row">
          <button class="task-circle" data-minutes="5" aria-label="Mark complete"></button>
          <div class="task-name">Reply to study group email</div>
          <span class="task-time">5 min</span>
        </div>
      </div>

      <div class="spacer"></div>
      <div class="progress-label">
        <span id="progress-text">40 of 45 min planned</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 89%;"></div>
      </div>
      <a href="#" class="btn-primary" id="start-btn">Start first task</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
